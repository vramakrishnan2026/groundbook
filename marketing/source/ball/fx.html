<html><body style="margin:0;background:transparent">
<canvas id="c" width="1400" height="1400"></canvas>
<script>
// Golden light rings orbiting the ball, with sparks: back half drawn behind the ball, front half over it.
const c = document.getElementById('c'), g = c.getContext('2d');
const P = new URLSearchParams(location.search), BG = P.get('bg') || '#03140c', MODE = P.get('mode') || 'rings';
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const img = new Image(); img.src = 'ball-front.png';
img.onload = () => {
  const W = 1400, cx = Number(P.get('cx') || 700), cy = Number(P.get('cy') || 700), R = Number(P.get('r') || 380);
  if (BG !== 'none') { const bg = g.createRadialGradient(700, 620, 60, 700, 700, 900); bg.addColorStop(0, P.get('bg2') ? '#' + P.get('bg2') : '#14894a'); bg.addColorStop(1, BG === 'none' ? '#000' : (P.get('bgc') ? '#' + P.get('bgc') : BG)); g.fillStyle = bg; g.fillRect(0, 0, W, W); }
  const rings = Array.from({ length: 15 }, (_, i) => ({ rx: R * (1.04 + rnd() * .42), ry: R * (.42 + rnd() * .5), rot: -0.5 + (rnd() - .5) * 1.1, w: .8 + rnd() * 3.2, a0: rnd() * 6.28, len: 1.6 + rnd() * 3.4, alpha: .35 + rnd() * .65 }));
  const ring = (front) => {
    g.save(); g.globalCompositeOperation = 'lighter';
    for (const r of rings) {
      g.save(); g.translate(cx, cy); g.rotate(r.rot);
      for (let k = 0; k < 3; k++) {         // glow passes: wide soft, mid, bright core
        g.beginPath();
        const steps = 120;
        for (let s = 0; s <= steps; s++) {
          const t = r.a0 + r.len * s / steps, x = Math.cos(t) * r.rx, y = Math.sin(t) * r.ry;
          const isFront = Math.sin(t) > 0;
          if (isFront !== front) { g.moveTo(x, y); continue; }
          g.lineTo(x, y);
        }
        g.lineCap = 'round';
        g.strokeStyle = k === 2 ? `rgba(255,248,215,${r.alpha})` : k === 1 ? `rgba(255,190,60,${r.alpha * .7})` : `rgba(255,120,10,${r.alpha * .35})`;
        g.lineWidth = r.w * (k === 2 ? 1 : k === 1 ? 3 : 9);
        g.shadowColor = 'rgba(255,150,30,.9)'; g.shadowBlur = k === 0 ? 40 : 14;
        g.stroke();
      }
      g.restore();
    }
    // sparks along the rings
    for (let i = 0; i < 320; i++) {
      const r = rings[i % rings.length], t = r.a0 + rnd() * r.len, x = Math.cos(t) * r.rx * (1 + (rnd() - .5) * .12), y = Math.sin(t) * r.ry * (1 + (rnd() - .5) * .4);
      if ((Math.sin(t) > 0) !== front) continue;
      const px = cx + x * Math.cos(r.rot) - y * Math.sin(r.rot), py = cy + x * Math.sin(r.rot) + y * Math.cos(r.rot), s = rnd() * 3.2 + .6;
      g.fillStyle = `rgba(255,${200 + rnd() * 55 | 0},${120 + rnd() * 100 | 0},${.5 + rnd() * .5})`; g.shadowColor = '#ffb020'; g.shadowBlur = 12;
      g.beginPath(); g.arc(px, py, s, 0, 6.28); g.fill();
    }
    g.restore();
  };
  if (P.get('noball') !== '1') { g.save(); g.globalCompositeOperation = 'lighter'; const h = g.createRadialGradient(cx, cy, R * .6, cx, cy, R * 1.9); h.addColorStop(0, 'rgba(255,170,40,.42)'); h.addColorStop(.5, 'rgba(255,120,20,.12)'); h.addColorStop(1, 'rgba(255,120,20,0)'); g.fillStyle = h; g.fillRect(0, 0, W, W); g.restore(); }
  if (MODE === 'trail') {
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < Number(P.get('n') || 70); i++) {          // comet trail of flame streaks behind the ball
      const TL = Number(P.get('tl') || 1), a = Math.PI + (rnd() - .5) * 0.7, len = (300 + rnd() * 520) * TL, y0 = cy + (rnd() - .5) * R * 1.5, x0 = cx - R * .2;
      const grd = g.createLinearGradient(x0, y0, x0 - len, y0 + Math.sin(a - Math.PI) * len);
      grd.addColorStop(0, 'rgba(255,240,190,.9)'); grd.addColorStop(.25, 'rgba(255,170,40,.7)'); grd.addColorStop(.7, 'rgba(230,70,10,.35)'); grd.addColorStop(1, 'rgba(160,20,0,0)');
      g.strokeStyle = grd; g.lineWidth = (3 + rnd() * 16) * Number(P.get('lw') || 1); g.lineCap = 'round'; g.shadowColor = 'rgba(255,120,20,.8)'; g.shadowBlur = 30;
      g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(x0 - len * .5, y0 + (rnd() - .5) * 120, x0 - len, y0 + Math.sin(a - Math.PI) * len + (rnd() - .5) * 80); g.stroke();
    }
    g.restore();
  } else ring(false);
  // the ball, with a warm rim light
  if (P.get('noball') !== '1') { g.save(); g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 60; g.shadowOffsetY = 30;
  g.drawImage(img, cx - R, cy - R, R * 2, R * 2); g.restore(); }
  if (P.get('rim') === '1') { g.save(); g.globalCompositeOperation = 'source-atop';
  const rim = g.createRadialGradient(cx + R * .35, cy + R * .45, R * .5, cx, cy, R * 1.02); rim.addColorStop(0, 'rgba(255,140,20,0)'); rim.addColorStop(.85, 'rgba(255,140,20,0)'); rim.addColorStop(1, 'rgba(255,150,30,.55)');
  g.globalCompositeOperation = 'lighter'; g.beginPath(); g.arc(cx, cy, R, 0, 6.28); g.fillStyle = rim; g.fill(); g.restore(); }
  if (MODE !== 'trail') ring(true);
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 26; i++) { const a = rnd() * 6.28, d = R * (1.2 + rnd() * .7), x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * .85, s = 3 + rnd() * 10;
    const b = g.createRadialGradient(x, y, 0, x, y, s); b.addColorStop(0, 'rgba(255,220,140,.55)'); b.addColorStop(1, 'rgba(255,180,60,0)'); g.fillStyle = b; g.beginPath(); g.arc(x, y, s, 0, 6.28); g.fill(); }
  g.restore();
  document.title = 'done';
};
</script></body></html>
