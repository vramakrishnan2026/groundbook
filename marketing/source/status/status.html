<html><head><style>
@font-face{font-family:Anton;src:url(Anton-Regular.ttf)}
@font-face{font-family:Marker;src:url(PermanentMarker-Regular.ttf)}
@font-face{font-family:Barlow;font-weight:600;src:url(BarlowCondensed-SemiBold.ttf)}
@font-face{font-family:Barlow;font-weight:700;src:url(BarlowCondensed-Bold.ttf)}
@font-face{font-family:Barlow;font-weight:800;src:url(BarlowCondensed-ExtraBold.ttf)}
@font-face{font-family:MontIt;src:url(MontIt.ttf);font-weight:100 900;font-style:italic}
body{margin:0;background:#000}
#p{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Barlow;color:#fff}
.abs{position:absolute}
</style></head><body>
<div id="p">
  <img src="stadium.jpg" class="abs" style="inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.6) brightness(.55)">
  <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(2,24,14,.92) 0%,rgba(4,40,24,.55) 38%,rgba(2,20,12,.8) 70%,rgba(1,10,6,.97) 100%)"></div>
  <div class="abs" style="left:-200px;top:180px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,30,.22),rgba(255,150,30,0) 60%)"></div>
  <svg class="abs" id="scr" style="left:0;top:0" width="1080" height="1920"></svg>
  <!-- corner frames -->
  <svg class="abs" style="left:0;top:0" width="1080" height="1920"><path d="M40 560 V40 H420" fill="none" stroke="#f5c542" stroke-width="10"/><path d="M1040 1360 V1880 H660" fill="none" stroke="#f5c542" stroke-width="10"/>
    <polygon points="1080,0 1080,190 890,0" fill="#ff9a1f"/><polygon points="0,1920 0,1730 190,1920" fill="#ff9a1f"/></svg>

  <div class="abs" style="left:0;right:0;top:96px;text-align:center"><span style="display:inline-block;background:linear-gradient(135deg,#ffe680,#f59e0b);color:#06200f;font-weight:800;font-size:58px;letter-spacing:5px;padding:14px 40px 12px;transform:rotate(-3deg);box-shadow:0 14px 30px rgba(0,0,0,.5)">SOMETHING I'VE BUILT</span></div>
  <div class="abs" style="left:0;right:0;top:205px;text-align:center;transform:rotate(-5deg)">
    <span style="font-family:Marker;font-size:190px;color:#fff;text-shadow:8px 10px 0 rgba(0,0,0,.35)">Meet</span></div>
  <img src="logo.png" class="abs" style="left:50%;top:400px;width:1040px;transform:translateX(-50%)">

  <div class="abs" style="left:0;right:0;top:720px;text-align:center;font-family:Anton;font-size:84px;line-height:1.05;letter-spacing:1px">YOUR GROUND'S OWN<br><span style="color:#f5c542">BOOKING PAGE</span></div>

  <!-- phone -->
  <div class="abs" style="left:120px;top:985px;width:360px;height:640px;border-radius:52px;background:#0b0f0d;padding:13px;box-sizing:border-box;transform:rotate(-6deg);box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 3px #2a3a31 inset">
    <div style="width:100%;height:100%;border-radius:40px;overflow:hidden;background:#fff"><img src="c1-ground.png" style="width:100%;display:block"></div></div>

  <div class="abs" style="left:540px;top:1030px;width:470px;display:flex;flex-direction:column;gap:38px">
    <div style="display:flex;gap:20px;align-items:center"><div style="width:84px;height:84px;flex:none;border-radius:50%;background:#f5c542;color:#06200f;font-family:Anton;font-size:38px;display:flex;align-items:center;justify-content:center">0%</div><div style="font-weight:800;font-size:46px;line-height:1">Zero commission<div style="font-weight:600;font-size:32px;color:#cfe3d6;margin-top:6px">The money stays with the ground</div></div></div>
    <div style="display:flex;gap:20px;align-items:center"><div style="width:84px;height:84px;flex:none;border-radius:50%;background:#f5c542;color:#06200f;font-family:Anton;font-size:40px;display:flex;align-items:center;justify-content:center">₹</div><div style="font-weight:800;font-size:46px;line-height:1">Pay by UPI<div style="font-weight:600;font-size:32px;color:#cfe3d6;margin-top:6px">Straight to the owner's bank</div></div></div>
    <div style="display:flex;gap:20px;align-items:center"><div style="width:84px;height:84px;flex:none;border-radius:50%;background:#f5c542;display:flex;align-items:center;justify-content:center"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#06200f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div><div style="font-weight:800;font-size:46px;line-height:1">No app to download<div style="font-weight:600;font-size:32px;color:#cfe3d6;margin-top:6px">Book a slot in 30 seconds</div></div></div>
  </div>

  <div class="abs" style="left:0;right:0;top:1690px;text-align:center">
    <div style="font-weight:700;font-size:44px;color:#ffe2a6">Know a turf owner? Send them my way!</div>
    <div style="display:inline-block;margin-top:22px;background:linear-gradient(135deg,#ffe680,#f59e0b);color:#06200f;font-weight:800;font-size:50px;padding:16px 46px;border-radius:999px;letter-spacing:1px">book.goarena.in</div>
  </div>
</div>
<script>
// neon brush scratches, gold to orange, seeded so the poster always looks the same
let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
const svg = document.getElementById('scr'); let h = '';
const sc = (x, y, len, ang, w) => h += `<path d="M${x} ${y} l${(Math.cos(ang) * len).toFixed(1)} ${(Math.sin(ang) * len).toFixed(1)}" stroke="${r() > .5 ? '#ffb020' : '#ff7a1a'}" stroke-width="${w.toFixed(1)}" stroke-linecap="round" opacity="${(.5 + r() * .5).toFixed(2)}"/>`;
for (let i = 0; i < 18; i++) sc(40 + r() * 240, 60 + r() * 380, 90 + r() * 260, -0.95 + r() * .3, 2 + r() * 7);
for (let i = 0; i < 16; i++) sc(940 + r() * 120, 1640 + r() * 240, 60 + r() * 150, -1.15 + r() * .3, 2 + r() * 6);
svg.innerHTML = h;
document.fonts.ready.then(() => document.title = 'done');
</script></body></html>
