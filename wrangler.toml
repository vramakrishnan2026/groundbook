name = "groundbook"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# The web app (HTML/CSS/JS). Unknown paths fall back to index.html so links like /g/green-field work.
# Every request reaches the Worker first; it handles /api/* and passes the rest to the app files.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Bookings, grounds, prices, staff, and the photos / screenshots (no R2 needed). Create with:  npx wrangler d1 create groundbook
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "groundbook"
database_id = "7053dd1b-7f05-4f15-9013-a843a6b1fba8"
migrations_dir = "migrations"


# Release expired 30-minute holds every 5 minutes (also done on every request).
[triggers]
crons = ["*/5 * * * *"]

# Custom domain (also visible in Workers → groundbook → Domains). Keeping it here means
# deploys from GitHub never detach it.
[[routes]]
pattern = "book.goarena.in"
custom_domain = true

# The customer-facing address, used for the booking link and QR code in Settings.
[vars]
PUBLIC_URL = "https://book.goarena.in"
# "Sign in with Google": the OAuth Web client ID from Google Cloud (it is public, not a secret).
# Leave empty to hide all Google buttons; phone + PIN still works.
GOOGLE_CLIENT_ID = "512357431950-1ireu5n6iqg2pta1edl5h6rqgn8m1agm.apps.googleusercontent.com"
# Gmail addresses allowed to approve new grounds at book.goarena.in/admin (comma separated).
ADMIN_EMAILS = ""

[observability]
enabled = true
